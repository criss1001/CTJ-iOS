name: Temporary Build NESEmu IPA

on:
  push:
    branches: [ main ]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout NESEmu build branch
        uses: actions/checkout@v4
        with:
          ref: nesemu-save-load

      - name: Recreate source
        run: |
          set -e
          cat nesemu_build/source.b64.* > source.b64
          python3 -c "import base64,pathlib; pathlib.Path('nesemu_source.zip').write_bytes(base64.b64decode(pathlib.Path('source.b64').read_bytes()))"
          rm -rf nesemu-src
          mkdir nesemu-src
          unzip -q nesemu_source.zip -d nesemu-src
          test -f nesemu-src/project.yml

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: nesemu-src
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: nesemu-src
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project NESEmu.xcodeproj \
            -scheme NESEmu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build 2>&1 | tee build.log

      - name: Package IPA
        working-directory: nesemu-src
        run: |
          set -e
          APP=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'NESEmu.app' -print -quit)
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry NESEmu-build.ipa Payload
          test -s NESEmu-build.ipa

      - name: Store successful build
        if: success()
        run: |
          cp nesemu-src/NESEmu-build.ipa NESEmu-build.ipa
          rm -f NESEmu-build-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NESEmu-build.ipa NESEmu-build-error.log || true
          git commit -m "Store NESEmu build [skip ci]" || exit 0
          git push origin HEAD:nesemu-save-load

      - name: Store failure log
        if: failure()
        run: |
          test -f nesemu-src/build.log || exit 0
          cp nesemu-src/build.log NESEmu-build-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NESEmu-build-error.log
          git commit -m "Store NESEmu build error [skip ci]" || exit 0
          git push origin HEAD:nesemu-save-load
