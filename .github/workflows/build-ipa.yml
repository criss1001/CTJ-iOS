name: Build CTJ iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP and apply iOS v13 safe large-disc files
        run: |
          set -e
          rm -rf ios-src
          mkdir ios-src
          unzip -q CTJ_Modern_Tool_v42_iOS_IPA_BUILD_READY.zip -d ios-src
          test -f ios-src/CTJModernTooliOS.xcodeproj/project.pbxproj
          cp patches/ContentView_v11.swift ios-src/CTJModernTooliOS/ContentView.swift
          cp patches/CTJModernTooliOSApp_v11.swift ios-src/CTJModernTooliOS/CTJModernTooliOSApp.swift
          python3 -c "import gzip,base64,pathlib; p=pathlib.Path('patches/Models_v12.swift.gz.b64'); pathlib.Path('ios-src/CTJModernTooliOS/Models.swift').write_bytes(gzip.decompress(base64.b64decode(p.read_bytes())))"
          sed -i '' '1i\
          import UIKit\
          ' ios-src/CTJModernTooliOS/Models.swift
          tail -n +2 patches/PlayerPortraitSupport.swift >> ios-src/CTJModernTooliOS/Models.swift
          tail -n +2 patches/LargeDiscImport_v13.swift >> ios-src/CTJModernTooliOS/Models.swift

          # Use memory-mapped importer and never publish the whole 600+ MB image to SwiftUI.
          sed -i '' 's/model\.importDisc(url:url)/model.importLargeDiscSafely(url: url)/g' ios-src/CTJModernTooliOS/ContentView.swift

          # All read-only disc parsing paths use the private large-disc store when available.
          sed -i '' 's/PSXDiscImage(data: discData)/PSXDiscImage(data: effectiveDiscData)/g' ios-src/CTJModernTooliOS/Models.swift

          # Do not hard-code one game filename in the UI.
          sed -i '' 's/CTJ\.bin/ملف اللعبة/g' ios-src/CTJModernTooliOS/ContentView.swift

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Inspect project
        working-directory: ios-src
        run: xcodebuild -project CTJModernTooliOS.xcodeproj -list

      - name: Build unsigned app
        working-directory: ios-src
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project CTJModernTooliOS.xcodeproj \
            -target CTJModernTooliOS \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios-src/xcodebuild.log
          if-no-files-found: ignore

      - name: Persist failure log
        if: failure()
        run: |
          if [ -f ios-src/xcodebuild.log ]; then
            cp ios-src/xcodebuild.log LATEST_XCODEBUILD_ERROR.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add LATEST_XCODEBUILD_ERROR.log
            git diff --cached --quiet || git commit -m "Capture xcodebuild failure [skip ci]"
            git push
          fi

      - name: Package IPA
        working-directory: ios-src
        run: |
          set -e
          APP=$(find build/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CTJ_Modern_Tool_v42-v13b-unsigned.ipa Payload
          test -s CTJ_Modern_Tool_v42-v13b-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CTJ_Modern_Tool_v42-v13b-unsigned-IPA
          path: ios-src/CTJ_Modern_Tool_v42-v13b-unsigned.ipa
          if-no-files-found: error
