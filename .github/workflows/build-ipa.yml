name: Build CTJ iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP and apply iOS v11 fixes
        run: |
          set -e
          rm -rf ios-src
          mkdir ios-src
          unzip -q CTJ_Modern_Tool_v42_iOS_IPA_BUILD_READY.zip -d ios-src
          test -f ios-src/CTJModernTooliOS.xcodeproj/project.pbxproj

          cp patches/ContentView_v10.swift ios-src/CTJModernTooliOS/ContentView.swift
          cp patches/CTJModernTooliOSApp_v11.swift ios-src/CTJModernTooliOS/CTJModernTooliOSApp.swift

          # Keep native player portrait support.
          sed -i '' '1i\
          import UIKit\
          ' ios-src/CTJModernTooliOS/Models.swift
          tail -n +2 patches/PlayerPortraitSupport.swift >> ios-src/CTJModernTooliOS/Models.swift

          # Replace SwiftUI fileImporter for the disc with a UIKit document picker.
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ios-src/CTJModernTooliOS/ContentView.swift')
          s = p.read_text()

          # Force TabView to occupy the full app window and extend to the physical bottom edge.
          s = s.replace(
              '        .tint(.cyan)\n        .preferredColorScheme(.dark)',
              '        .frame(maxWidth: .infinity, maxHeight: .infinity)\n        .ignoresSafeArea(.container, edges: .bottom)\n        .tint(.cyan)\n        .preferredColorScheme(.dark)'
          )

          old = re.compile(r'''\n        \.fileImporter\(isPresented:\$importDisc, allowedContentTypes:\[\.item\], allowsMultipleSelection:false\) \{ result in\n            switch result \{\n            case \.success\(let urls\):\n                if let url = urls\.first \{ model\.importDisc\(url:url\) \}\n                else \{ model\.status = "لم يتم اختيار ملف" \}\n            case \.failure\(let e\):\n                model\.status="اختيار الملف فشل: \\(e\.localizedDescription\)"\n            \}\n        \}''')
          replacement = '''
        .sheet(isPresented:$importDisc) {
            AnyFilePicker(
                onPick: { url in
                    model.importDisc(url:url)
                    importDisc = false
                },
                onCancel: { importDisc = false }
            )
            .ignoresSafeArea()
        }'''
          s, count = old.subn(replacement, s)
          if count != 1:
              raise SystemExit(f'Could not replace disc fileImporter; replacements={count}')

          # Append the UIKit picker in the same compiled Swift file so no pbxproj edit is needed.
          helper = Path('patches/AnyFilePicker_v11.swift').read_text()
          helper = '\n'.join(line for line in helper.splitlines() if not line.startswith('import '))
          s += '\n\n' + helper + '\n'
          p.write_text(s)
          PY

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Inspect project
        working-directory: ios-src
        run: xcodebuild -project CTJModernTooliOS.xcodeproj -list

      - name: Build unsigned app
        working-directory: ios-src
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project CTJModernTooliOS.xcodeproj \
            -target CTJModernTooliOS \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios-src/xcodebuild.log
          if-no-files-found: ignore

      - name: Persist failure log
        if: failure()
        run: |
          if [ -f ios-src/xcodebuild.log ]; then
            cp ios-src/xcodebuild.log LATEST_XCODEBUILD_ERROR.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add LATEST_XCODEBUILD_ERROR.log
            git diff --cached --quiet || git commit -m "Capture xcodebuild failure [skip ci]"
            git push
          fi

      - name: Package IPA
        working-directory: ios-src
        run: |
          set -e
          APP=$(find build/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CTJ_Modern_Tool_v42-v11-unsigned.ipa Payload
          test -s CTJ_Modern_Tool_v42-v11-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CTJ_Modern_Tool_v42-v11-unsigned-IPA
          path: ios-src/CTJ_Modern_Tool_v42-v11-unsigned.ipa
          if-no-files-found: error
