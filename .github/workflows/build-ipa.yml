name: Build CTJ iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
      - name: Build unsigned app
        run: |
          set -e
          xcodebuild \
            -project CTJModernTooliOS.xcodeproj \
            -scheme CTJModernTooliOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CTJ_Modern_Tool_v42-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CTJ_Modern_Tool_v42-unsigned-IPA
          path: CTJ_Modern_Tool_v42-unsigned.ipa
