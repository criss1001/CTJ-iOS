name: Build CTJ iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e
          rm -rf ios-src
          mkdir ios-src
          unzip -q CTJ_Modern_Tool_v42_iOS_IPA_BUILD_READY.zip -d ios-src
          test -f ios-src/CTJModernTooliOS.xcodeproj/project.pbxproj

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Inspect project
        working-directory: ios-src
        run: xcodebuild -project CTJModernTooliOS.xcodeproj -list

      - name: Build unsigned app
        working-directory: ios-src
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project CTJModernTooliOS.xcodeproj \
            -target CTJModernTooliOS \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios-src/xcodebuild.log
          if-no-files-found: ignore

      - name: Persist failure log
        if: failure()
        run: |
          if [ -f ios-src/xcodebuild.log ]; then
            cp ios-src/xcodebuild.log LATEST_XCODEBUILD_ERROR.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add LATEST_XCODEBUILD_ERROR.log
            git diff --cached --quiet || git commit -m "Capture xcodebuild failure [skip ci]"
            git push
          fi

      - name: Package IPA
        working-directory: ios-src
        run: |
          set -e
          APP=$(find build/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CTJ_Modern_Tool_v42-unsigned.ipa Payload
          test -s CTJ_Modern_Tool_v42-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CTJ_Modern_Tool_v42-unsigned-IPA
          path: ios-src/CTJ_Modern_Tool_v42-unsigned.ipa
          if-no-files-found: error
