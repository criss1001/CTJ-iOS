name: Temporary Build NESEmu IPA

on:
  push:
    branches: [ main ]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout NESEmu build branch
        uses: actions/checkout@v4
        with:
          ref: nesemu-save-load

      - name: Build and persist result
        shell: bash
        run: |
          set +e
          rm -f NESEmu-build.ipa NESEmu-build-error.log NESEmu-ci.log
          (
            set -e
            cat \
              nesemu_build/source.b64.01 \
              nesemu_build/source.b64.02 \
              nesemu_build/source.b64.03 \
              nesemu_build/source.b64.04 \
              nesemu_build/source.b64.05 \
              nesemu_build/source.b64.06 \
              nesemu_build/source.b64.07 > source.b64
            python3 -c "import base64,pathlib; pathlib.Path('nesemu_source.zip').write_bytes(base64.b64decode(pathlib.Path('source.b64').read_bytes()))"
            rm -rf nesemu-src
            mkdir nesemu-src
            unzip -q nesemu_source.zip -d nesemu-src
            test -f nesemu-src/project.yml
            XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
            xcodebuild -version
            brew install xcodegen
            cd nesemu-src
            xcodegen generate
            xcodebuild \
              -project NESEmu.xcodeproj \
              -scheme NESEmu \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$PWD/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY='' \
              DEVELOPMENT_TEAM='' \
              build
            APP=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'NESEmu.app' -print -quit)
            test -n "$APP"
            rm -rf Payload
            mkdir Payload
            cp -R "$APP" Payload/
            zip -qry NESEmu-build.ipa Payload
            test -s NESEmu-build.ipa
            cp NESEmu-build.ipa ../NESEmu-build.ipa
          ) > >(tee NESEmu-ci.log) 2>&1
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            cp NESEmu-ci.log NESEmu-build-error.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f NESEmu-build.ipa NESEmu-build-error.log NESEmu-ci.log 2>/dev/null || true
          git commit -m "NESEmu CI result [skip ci]" || true
          git push origin HEAD:nesemu-save-load
          exit "$STATUS"
